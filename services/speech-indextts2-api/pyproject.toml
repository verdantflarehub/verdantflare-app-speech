[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verdantflare-speech-indextts2-api"
version = "0.1.3"
requires-python = ">=3.11"
dependencies = ["fastapi==0.135.1", "uvicorn==0.40.0", "jsonschema==4.25.1", "soundfile==0.13.1", "numpy==1.26.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
speech_runtime = ["contract.json"]
