[project]
name = "verdantflare-speech-mcp-server"
version = "0.2.0"
description = "Durable Studio speech tasks, Dashboard API, and native Artifact delivery"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "httpx==0.28.1",
  "jsonschema==4.23.0",
  "psycopg[binary]==3.2.6",
]

[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
speech_mcp = ["contract.json", "schema.sql", "dashboard_src/*"]
