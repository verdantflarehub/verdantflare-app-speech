[project]
name = "speech-voice-design-engine"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.8.0", "torchaudio==2.8.0", "transformers==4.52.1",
  "einops==0.8.1", "pydantic==2.11.7", "tqdm==4.67.1",
  "huggingface-hub==0.34.4", "safetensors==0.6.2", "librosa==0.11.0",
  "jsonschema==4.25.1", "numpy==1.26.4", "soundfile==0.13.1",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = [{index = "pytorch-cuda"}]
torchaudio = [{index = "pytorch-cuda"}]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
