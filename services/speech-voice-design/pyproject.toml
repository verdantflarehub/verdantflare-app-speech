[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-voice-design"
version = "0.1.1"
requires-python = ">=3.11,<3.12"
dependencies = ["jsonschema==4.25.1", "numpy==1.26.4", "soundfile==0.13.1"]

[project.scripts]
speech-voice-design = "voice_design.cli:main"

[tool.setuptools.package-data]
voice_design = ["request.schema.json", "model.lock.json"]
