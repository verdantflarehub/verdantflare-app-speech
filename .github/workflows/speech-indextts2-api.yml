name: Speech IndexTTS2 API
on:
  workflow_dispatch:
  push:
    branches: [release]
    paths:
      - services/speech-indextts2-api/**
      - scripts/check-image-absent.sh
      - .github/workflows/speech-indextts2-api.yml
permissions:
  contents: read
concurrency:
  group: speech-indextts2-api-release
  cancel-in-progress: false
env:
  REGISTRY_ENDPOINT: ${{ secrets.REGISTRY_ENDPOINT_ALIYUN }}
  IMAGE_NAME: wod/verdantflare-app
  IMAGE_VERSION: speech-indextts2-api-v0.1.5
jobs:
  image:
    name: Build and publish speech runtime
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Configure release destination
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          endpoint="${REGISTRY_ENDPOINT%/}"
          [[ "$endpoint" =~ ^[a-zA-Z0-9.-]+(:[0-9]+)?$ ]] || { echo 'Invalid or missing registry endpoint'; exit 1; }
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"
          echo "image=$endpoint/$IMAGE_NAME" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.endpoint }}
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}
      - name: Refuse an existing release image
        env:
          IMAGE: ${{ steps.registry.outputs.image }}:${{ env.IMAGE_VERSION }}
        run: bash scripts/check-image-absent.sh
      - name: Build and publish release image
        uses: docker/build-push-action@v6
        with:
          context: services/speech-indextts2-api
          push: true
          platforms: linux/amd64
          tags: ${{ steps.registry.outputs.image }}:${{ env.IMAGE_VERSION }}
          cache-from: type=gha,scope=speech-indextts2-api
          cache-to: type=gha,mode=max,scope=speech-indextts2-api
          provenance: false
          sbom: false
